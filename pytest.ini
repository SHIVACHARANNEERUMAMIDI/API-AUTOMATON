[pytest]
testpaths = testCases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --html-report=Reports/latest_report.html --title="Underwriter API Automation Regression Report"
console_output_style = count
filterwarnings =
    ignore::urllib3.exceptions.InsecureRequestWarning

markers =
    login: Authentication and session establishment tests
    b2c: Business-to-Consumer user flow tests
    claims: Claims filing, rejection, and approval tests
    endorsement: Policy service request and endorsement tests
    digitization: Underwriter manual digitization and verification tests
    agent: Agent chats and user callback flow tests
    questions: Questionnaire categories and details tests
    P0: Critical path test cases
    P1: High priority test cases
    P2: Medium priority test cases
    Smoke: Smoke test suite
    Regression: Full regression suite


